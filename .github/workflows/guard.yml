name: Public repository guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: No source code in the public repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history is checked, not only the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extractor
        run: python3 -m pip install --quiet pypdf

      - name: Check the working tree
        run: python3 scripts/check_public_repo.py

      - name: Check the whole history
        run: python3 scripts/check_public_repo.py --history
